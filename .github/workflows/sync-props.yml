name: Sync PropLine Board to UI

on:
  workflow_dispatch: # Lets you click "Refresh Board" from the GitHub Mobile App
  schedule:
    - cron: '0 17,21,23 * * *' # Auto-syncs at 10 AM, 2 PM, and 4 PM PDT

permissions:
  contents: write

jobs:
  sync-board:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch PropLine & Write data/props.json
        env:
          PROPLINE_API_KEY: ${{ secrets.PROPLINE_API_KEY }}
        run: |
          mkdir -p data
          node scripts/fetchBoard.mjs

      - name: Commit Updated Props JSON to GitHub Pages
        run: |
          git config user.name "SlipDraw Bot"
          git config user.email "bot@slipdraw.io"
          git add data/props.json
          git diff --staged --quiet || git commit -m "Auto-sync PropLine board"
          git push
